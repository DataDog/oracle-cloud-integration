# Title shown in Application Information tab.
title: Datadog Forwarding Infrastructure
# Sub Title shown in Application Information tab.
description: Setting up infrastructure for sending OCI metrics and logs to Datadog
schemaVersion: 1.1.0
version: 1.0
locale: en
variableGroups:
  - title: "Tenancy"
    variables:
      - ${tenancy_ocid}
      - ${region}
      - ${compartment_ocid}
      - ${current_user_ocid}
    visible: false
  - title: "Datadog Environment"
    variables:
      - ${datadog_app_key}
      - ${datadog_api_key}
      - ${datadog_site}
      - ${logs_enabled}
      - ${events_collection_enabled}
      - ${logs_only}
  - title: "(Optional) Choose specific subnet(s)"
    variables:
      - ${choose_subnet}
      - ${subnet_ocids}
  - title: "(Optional) Choose a User"
    variables:
      - ${choose_user}
      - ${existing_group_id}
      - ${existing_user_id}
  - title: "(Optional) Enable multi-region vaults"
    variables:
      - ${enable_regional_vaults}
  - title: "(Optional) Reuse an existing vault"
    variables:
      - ${existing_vault_id}
  - title: "(Optional) Advanced configuration"
    variables:
      - ${show_advanced_options}
      - ${compartment_id}
      - ${domain_id}
      - ${user_email}
      - ${defined_tags}

variables:
  choose_subnet:
    title: Choose specific subnet(s)
    type: boolean
    description: |
      <strong>This is uncommon.</strong> Use existing subnets for the Datadog QuickStart stack.
      <strong>(Recommended): If left blank, a new Virtual cloud network (VCN) and subnet will be created in each region that the tenancy is subscribed to.</strong>
    required: false
    default: false

  choose_user:
    title: Choose a Group and User for Datadog authentication
    type: boolean
    description: |
      <strong>This is uncommon.</strong> Use an existing Group and User to authenticate access to Datadog.
      <strong>(Recommended): If left blank, a new Group and User will be created in the current Identity Domain.</strong>
    required: false
    default: false

  show_advanced_options:
    title: Use advanced options
    type: boolean
    description: |
      <strong>This is uncommon.</strong> Use an existing Compartment and Domain for the Datadog QuickStart stack.
      <strong>(Recommended): If left blank, a new Compartment will be created.</strong>
    required: false
    default: false

  # Networking Options
  subnet_ocids:
    title: Subnet IDs
    type: text
    multiline: true
    description: |
      Provide a list of OCID(s) for existing subnet(s) to use for the Datadog QuickStart stack. Enter one OCID per line. Do not add commas.
      The Datadog QuickStart stack will be deployed in the region corresponding to each subnet.
      Each subnet OCID should be in the format: ocid1.subnet.oc[0-9].*
      Example: ocid1.subnet.oc1.iad.abcedfgh.
      <strong>(Recommended): If left blank, a new Virtual cloud network (VCN) and subnet will be created in each region in this tenancy.</strong>
    required: false
    default: ""
    visible: ${choose_subnet}

  # Datadog Environment
  datadog_api_key:
    title: Datadog API Key
    type: string
    description: |
      The API key for sending messages to Datadog endpoints. See <a href="https://docs.datadoghq.com/account_management/api-app-keys/" target="_blank">Datadog API Key</a> for more information.
    required: true
    sensitive: true
    password: true
    confirmation: true

  datadog_app_key:
    title: Datadog Application Key
    type: string
    description: |
      The Application key for creating and updating an integration with Datadog. See <a href="https://docs.datadoghq.com/account_management/api-app-keys/" target="_blank">Datadog Application Key</a> for more information.
    required: true
    sensitive: true
    password: true
    confirmation: true

  datadog_site:
    title: Datadog Site
    type: string
    description: |
      The site name for your Organization's Datadog endpoint (e.g. datadoghq.com, datadoghq.eu, etc.)
      This is the "Site Parameter" in the following <a href="https://docs.datadoghq.com/getting_started/site/#access-the-datadog-site" target="_blank">table from the Datadog documentation</a> .
    required: true

  logs_enabled:
    title: Logs Enabled
    type: string
    description: |
      Indicates if logs should be enabled/disabled
    required: false
    default: false

  events_collection_enabled:
    title: Event Collection Enabled
    type: string
    description: |
      Indicates if event collection (OCI Events Service) should be enabled. Note: this setting is ignored when Logs Only is enabled.
    required: false
    default: false

  logs_only:
    title: Logs Only
    type: boolean
    description: |
      Indicates if the integration should be created with metric, resource and event collection disabled, but available
    required: false
    default: false

  compartment_id:
    title: Compartment
    description: |
      Select a Compartment in which all Datadog QuickStack resources will be created.
      <strong>(Recommended): If left blank, a new Compartment will be created.</strong>
    type: oci:identity:compartment:id
    required: false
    default: null
    visible: ${show_advanced_options}

  existing_user_id:
    title: User ID
    type: string
    description: |
      Provide the OCID of an existing OCI User for Datadog authentication. The OCI User must be a member of the specified Group.
    required: true
    default: null
    visible: ${choose_user}

  existing_group_id:
    title: Group ID
    type: string
    description: |
      Provide the OCID of an existing OCI Group for Datadog authentication.
    required: true
    default: null
    visible: ${choose_user}

  domain_id:
    title: Domain ID
    type: string
    description: |
      Provide the OCID of the Identity Domain to use for the Datadog QuickStart stack.
      <strong>(Recommended): If left blank, the current Identity Domain will be used.</strong>
    required: false
    default: null
    visible:
      and:
        - ${show_advanced_options}
        - not:
            - ${choose_user}

  user_email:
    title: User Email
    type: string
    description: |
      <strong>This is required if you have specified a Domain in the field above.</strong>
      Provide the email address where you want OCI to send notifications about the created user.
    required: false
    default: null
    visible:
      and:
        - ${show_advanced_options}
        - not:
            - ${choose_user}

  enable_regional_vaults:
    title: Enable per-region Vaults
    type: boolean
    description: |
      Create a regional Vault, Key, and Secret in each subscribed region so that region's forwarder functions read its Datadog API key locally instead of crossing to the home region.
    required: false
    default: false

  existing_vault_id:
    title: Existing Vault OCID (reuse)
    type: string
    description: |
      <strong>This is uncommon.</strong> Reuse an existing <code>datadog-vault</code> in the Datadog compartment instead of creating a new one.
      Use this only when a previous install's vault is in <em>PENDING_DELETION</em> and the tenancy has no spare vault quota to create another.
      <strong>Before setting this, you must:</strong>
      1. Cancel the deletion of the existing <code>datadog-vault</code> (restores it to ACTIVE).
      2. Cancel the deletion of the <code>datadog-key</code> inside that vault (also a 7-day window).
      3. Cancel the deletion of the <code>DatadogAPIKey</code> secret inside that vault (restores it to ACTIVE).
      The existing <code>DatadogAPIKey</code> secret is reused as-is — its stored content is the API key the forwarder reads. We do NOT create a new secret, because OCI holds a secret name for the full pending-deletion window and a duplicate would be rejected. When set, the vault-quota precheck is skipped because no vault is created.
      Leave blank for normal installs.
    required: false
    default: null

  defined_tags:
    title: Resource tags
    type: text
    multiline: true
    description: |
      Provide a list of defined tag(s) to be added to all OCI resources deployed by the Datadog QuickStart stack.
       Enter one tag per line. Do not add commas. Each defined tag should be in the format: namespace.key:value. 
       Example: CostCenter.Environment:prod 
       <strong>If left blank, no defined tags will be added to the OCI resources deployed by the Datadog QuickStart stack.</strong>
    required: false
    default: ""
    visible: ${show_advanced_options}
